[pytest]
# IR-62-TEST-01: a bare `pytest` at the repo root used to abort with 3 collection errors.
# Two independent causes:
#   1. tests/test_metric.py and lane62/tests/test_metric.py share a module basename.
#   2. lane62/ and lane62-h62a/ each vendor their OWN copy of the `gems62` package
#      (lane62/src/gems62, lane62-h62a/src/gems62). Collecting them in the same interpreter
#      as the root copy makes the three shadow each other, whichever order they load in.
# They are deliberately independent re-derivations, so each is its own project: run them
# from their own directory, where their own pyproject.toml sets pythonpath = ["src"].
#     python3 -m pytest            <- root, 27 tests
#     (cd lane62      && python3 -m pytest)   <- 46 tests
#     (cd lane62-h62a && python3 -m pytest)   <- 41 tests
testpaths = tests
pythonpath = src
addopts = --import-mode=importlib

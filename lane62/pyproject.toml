[project]
name = "gems62"
version = "1.0.0"
description = "Lake Lahontan shoreline datum-offset lane for the DOE GEMS Prize (DrivenData #306)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "scikit-image>=0.22",
                "rasterio>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["gems62"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::RuntimeWarning", "ignore::UserWarning"]

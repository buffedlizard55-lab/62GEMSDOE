name: net-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: probe official sources (verbatim results, never silent)
        run: |
          mkdir -p evidence
          {
            echo "probe_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: $(uname -srm)"
            for u in \
              "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/n40w120/USGS_13_n40w120.tif" \
              "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/n40w120/USGS_13_n40w120.tif" \
              "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current/n40w120/USGS_1_n40w120.tif" \
              "https://tnmaccess.nationalmap.gov/api/v1/products?datasets=National+Elevation+Dataset+(NED)+1%2F3+arc-second&bbox=-119.5,39.9,-119.4,40.0&prodFormats=GeoTIFF&max=2" \
              "https://www.sciencebase.gov/catalog/item/60e5b4c1d34e86b938954d2f" \
              "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=2020-05-15&endtime=2020-05-16&minmagnitude=5&maxlatitude=39&minlatitude=37&maxlongitude=-117&minlongitude=-120" \
              "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N40_00_W120_00_DEM/Copernicus_DSM_COG_10_N40_00_W120_00_DEM.tif" \
              ; do
              echo "---- $u"
              curl -sS -L -o /dev/null -w 'http_code=%{http_code} size=%{size_download} content_type=%{content_type}\n' -r 0-8191 --max-time 90 "$u" 2>&1 || echo "curl_exit=$?"
            done
          } 2>&1 | tee evidence/net_probe.txt
          test -s evidence/net_probe.txt
      - name: commit receipt
        run: |
          git config user.name "gems62-bot"
          git config user.email "gems62-bot@users.noreply.github.com"
          git add evidence/net_probe.txt
          git commit -m "evidence: network probe receipt [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

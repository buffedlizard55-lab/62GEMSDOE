name: net-probe
on:
  push:
    paths:
      - .github/workflows/net-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe official sources
        run: |
          set -x
          date -u
          curl -sS -o /dev/null -w "tnm-api %{http_code}\n" --max-time 60 "https://tnmaccess.nationalmap.gov/api/v1/products?datasets=National%20Elevation%20Dataset%20(NED)%201%2F3%20arc-second&bbox=-119.5,39.5,-119.0,40.0&prodFormats=GeoTIFF&max=1" || true
          curl -sS -o /dev/null -w "3dep-13-head %{http_code} size=%{size_download}\n" -r 0-1023 --max-time 120 "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/n40w120/USGS_13_n40w120.tif" || true
          curl -sS -o /dev/null -w "3dep-1m-head %{http_code} size=%{size_download}\n" -r 0-1023 --max-time 120 "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1m/Projects/NV_LasVegas_2021_B21/TIFF/USGS_1M_11_x42y425_NV_LasVegas_2021_B21.tif" || true
      - name: write receipt
        run: |
          mkdir -p evidence
          curl -sS --max-time 60 "https://tnmaccess.nationalmap.gov/api/v1/products?datasets=National%20Elevation%20Dataset%20(NED)%201%2F3%20arc-second&bbox=-119.5,39.5,-119.0,40.0&prodFormats=GeoTIFF&max=2" -o evidence/tnm_probe.json || true
          ls -la evidence || true
      - name: commit receipt
        run: |
          git config user.name "gems62-bot"
          git config user.email "gems62-bot@users.noreply.github.com"
          git add -A evidence || true
          git commit -m "net-probe receipt [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

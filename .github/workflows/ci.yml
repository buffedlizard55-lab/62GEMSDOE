name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r lane62-h62a/requirements.txt

      - name: Unit suite (metric vs published worked example, writer, gates)
        run: pytest lane62-h62a/tests -q

      # Group A of scripts/verify_all.py needs no data: it re-derives the metric
      # from the organiser's published formula and cross-checks it against a
      # brute-force transcription. Groups B-F need the official rasters, which
      # are not in the repository, so they are run only when GEMS62_DATA is
      # supplied as a secret-backed cache.
      - name: Metric verification (no data required)
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run([sys.executable, "lane62-h62a/scripts/verify_all.py",
                                "--json", "lane62-h62a/evidence/verification_report_ci.json"],
                               capture_output=True, text=True)
          print(out.stdout[-6000:])
          sys.exit(0 if out.returncode == 0 else 1)
          PY
        continue-on-error: true

      - name: Site builds from evidence
        run: python lane62-h62a/scripts/build_site.py

      - name: No hand-typed scores on the site
        run: |
          ! grep -rilE "we scored|our score is|this file scored" lane62-h62a/docs/*.html

  # ---------------------------------------------------------------- root lane (this repository)
  # Two gates that exist because hand-typed claims went stale in earlier sessions:
  #   * every downloadable raster is re-audited from its bytes, and the committed
  #     manifest + verdict sidecars must be exactly what the audit regenerates;
  #   * every docs/*.md must render to the docs/*.html the site serves.
  root:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Root unit suite (axes, metric identities, leaderboard arithmetic, download claims)
        run: pytest tests -q

      - name: Download audit is reproducible from the committed bytes
        run: |
          python scripts/audit_downloads.py --write
          git diff --exit-code docs/downloads/ && echo "manifest + verdicts match the bytes"

      - name: Site pages match their markdown
        run: |
          python scripts/render_doc_pages.py --check
          # no page list here on purpose: scripts/render_doc_pages.py owns it (RENDERED) and
          # tests/test_doc_render.py imports the same list, so CI, the test and the tool cannot disagree
